name: Probe PVMBG (sementara)
on:
  push:
    branches: [probe-pvmbg]
    paths: ["probe/probe.sh"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: bash probe/probe.sh
        continue-on-error: true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probe && git commit -q -m "probe output" && git push -q origin HEAD:probe-pvmbg || true
