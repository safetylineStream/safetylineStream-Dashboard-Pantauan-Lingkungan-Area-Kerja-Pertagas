name: Update Bahaya Tambahan (petir, banjir sungai, GDACS)

# Tiga modul berbasis lokasi aset, semuanya tanpa API key:
#   - Potensi petir (prakiraan model Open-Meteo — bukan deteksi sambaran)
#   - Potensi banjir sungai (model GloFAS via Open-Meteo Flood) di sel sungai yang dilalui pipa
#   - Siklon tropis & bencana besar (GDACS)
# Jam GitHub = UTC: 22:40, 04:40, 10:40, 16:40 UTC = 05:40, 11:40, 17:40, 23:40 WIB.
# Ambang banjir (riwayat 5 tahun per sel sungai) diunduh bertahap tiap run sampai lengkap.
on:
  schedule:
    - cron: "40 22,4,10,16 * * *"
  push:            # SEMENTARA — uji di cabang, dihapus sebelum merge
    branches: [modul-bahaya-tambahan]
  workflow_dispatch:
    inputs:
      sel_per_run:
        description: "Banjir: jumlah sel sungai yang riwayatnya diunduh pada run ini (kosong = sesuai config)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  jalankan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BANJIR_SEL_PER_RUN: ${{ github.event.inputs.sel_per_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependensi
        run: pip install -r requirements.txt

      - name: Potensi petir (model)
        run: python scripts/petir_model.py
        timeout-minutes: 6
        continue-on-error: true

      - name: Siklon tropis & bencana besar (GDACS)
        run: python scripts/gdacs.py
        timeout-minutes: 5
        continue-on-error: true

      - name: Potensi banjir sungai (GloFAS)
        run: python scripts/banjir_sungai.py
        timeout-minutes: 15
        continue-on-error: true

      - name: Simpan hasil ke repositori
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf "$RUNNER_TEMP/bt" && mkdir -p "$RUNNER_TEMP/bt"
          for d in petir_model gdacs banjir; do [ -d data/$d ] && cp -r data/$d "$RUNNER_TEMP/bt/$d"; done
          [ -n "$(ls -A "$RUNNER_TEMP/bt")" ] || { echo "Belum ada hasil."; exit 0; }
          for i in 1 2 3; do
            git fetch -q origin ${{ github.ref_name }}
            git reset -q --hard origin/${{ github.ref_name }}
            for d in petir_model gdacs banjir; do
              [ -d "$RUNNER_TEMP/bt/$d" ] && { rm -rf data/$d; cp -r "$RUNNER_TEMP/bt/$d" data/$d; git add -A data/$d; }
            done
            if git diff --cached --quiet; then echo "Tidak ada perubahan data."; exit 0; fi
            git commit -q -m "Update bahaya tambahan $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M WIB')"
            git push -q origin HEAD:${{ github.ref_name }} && exit 0
            echo "Push ditolak (ada perubahan baru), mencoba lagi..."; sleep 5
          done
          exit 1
