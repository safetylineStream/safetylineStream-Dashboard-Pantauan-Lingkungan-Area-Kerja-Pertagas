name: Build Aset (KMZ/SHP)

on:
  push:
    paths:
      - "assets_raw/**"
      - "config/assets_sources.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Konversi KMZ/SHP → data/assets.geojson
        run: python scripts/build_assets.py

      - name: Hitung ulang jarak hotspot & gempa terhadap aset baru
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          ONEMAP_USERNAME: ${{ secrets.ONEMAP_USERNAME }}     # opsional, akun ESDM One Map
          ONEMAP_PASSWORD: ${{ secrets.ONEMAP_PASSWORD }}
          MAGMA_APP_ID: ${{ secrets.MAGMA_APP_ID }}           # opsional, APP_ID stakeholder MAGMA/PVMBG
          MAGMA_SECRET_KEY: ${{ secrets.MAGMA_SECRET_KEY }}
        run: python scripts/fetch_all.py
        timeout-minutes: 16
        continue-on-error: true

      - name: Simpan hasil
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Build ulang aset $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M WIB')" && git pull --rebase origin ${{ github.ref_name }} && git push)
