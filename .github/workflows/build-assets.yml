name: Build Aset (KMZ/SHP)

on:
  push:
    paths:
      - "assets_raw/**"
      - "config/assets_sources.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Konversi KMZ/SHP ke data aset
        run: python scripts/build_assets.py

      - name: Hitung ulang jarak terhadap aset baru
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          ONEMAP_USERNAME: ${{ secrets.ONEMAP_USERNAME }}
          ONEMAP_PASSWORD: ${{ secrets.ONEMAP_PASSWORD }}
          MAGMA_APP_ID: ${{ secrets.MAGMA_APP_ID }}
          MAGMA_SECRET_KEY: ${{ secrets.MAGMA_SECRET_KEY }}
        run: python scripts/fetch_all.py

      - name: Simpan hasil
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Build ulang aset $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M WIB')" && git pull --rebase origin ${{ github.ref_name }} && git push)
