name: Update Data Harian

on:
  schedule:
    - cron: "0 23 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependensi
        run: pip install -r requirements.txt

      - name: Ambil data hotspot, gempa, cuaca, gerakan tanah
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          ONEMAP_USERNAME: ${{ secrets.ONEMAP_USERNAME }}
          ONEMAP_PASSWORD: ${{ secrets.ONEMAP_PASSWORD }}
          MAGMA_APP_ID: ${{ secrets.MAGMA_APP_ID }}
          MAGMA_SECRET_KEY: ${{ secrets.MAGMA_SECRET_KEY }}
        run: python scripts/fetch_all.py

      - name: Simpan hasil ke repositori
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "Update data $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M WIB')"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
