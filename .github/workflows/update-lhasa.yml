name: Update Potensi Longsor (NASA LHASA)

# Peluang longsor harian NASA LHASA 2 terhadap seluruh jalur pipa & fasilitas.
# Jam GitHub = UTC: 22:15 UTC = 05:15 WIB, 09:15 UTC = 16:15 WIB (sebelum update data utama)
on:
  schedule:
    - cron: "15 22 * * *"
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  jalankan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependensi
        run: pip install -r requirements.txt rasterio numpy

      - name: Ambil NASA LHASA & analisis terhadap jalur pipa
        run: python scripts/lhasa.py
        timeout-minutes: 18
        continue-on-error: true

      - name: Simpan hasil ke repositori
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d data/lhasa ] || { echo "Belum ada hasil LHASA."; exit 0; }
          cp -r data/lhasa "$RUNNER_TEMP/lhasa_baru"
          for i in 1 2 3; do
            git fetch -q origin ${{ github.ref_name }}
            git reset -q --hard origin/${{ github.ref_name }}
            rm -rf data/lhasa && mkdir -p data && cp -r "$RUNNER_TEMP/lhasa_baru" data/lhasa
            git add -A data/lhasa/
            if git diff --cached --quiet; then echo "Tidak ada perubahan data."; exit 0; fi
            git commit -q -m "Update LHASA $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M WIB')"
            git push -q origin HEAD:${{ github.ref_name }} && exit 0
            echo "Push ditolak (ada perubahan baru), mencoba lagi..."; sleep 5
          done
          exit 1
