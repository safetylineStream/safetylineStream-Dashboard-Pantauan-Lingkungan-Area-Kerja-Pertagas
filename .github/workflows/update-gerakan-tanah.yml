name: Update Gerakan Tanah (PVMBG)

# Dipisah karena server PVMBG/ESDM lambat. 21:30 UTC = 04:30 WIB setiap hari.
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  jalankan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # selalu versi terbaru, bukan versi saat workflow dipicu

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependensi
        run: pip install -r requirements.txt

      - name: Ambil data gerakan tanah PVMBG & analisis terhadap aset
        env:
          BAGIAN: gerakan_tanah
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          ONEMAP_USERNAME: ${{ secrets.ONEMAP_USERNAME }}
          ONEMAP_PASSWORD: ${{ secrets.ONEMAP_PASSWORD }}
        run: python scripts/fetch_all.py
        timeout-minutes: 16
        continue-on-error: true

      - name: Simpan hasil ke repositori
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Simpan hasil baru, ambil versi terbaru repositori, lalu timpa folder data saja.
          # Dengan cara ini tidak pernah terjadi bentrok dengan data yang disimpan run lain.
          cp -r data "$RUNNER_TEMP/data_baru"
          for i in 1 2 3; do
            git fetch -q origin ${{ github.ref_name }}
            git reset -q --hard origin/${{ github.ref_name }}
            rm -rf data && cp -r "$RUNNER_TEMP/data_baru" data
            git add -A data/
            if git diff --cached --quiet; then echo "Tidak ada perubahan data."; exit 0; fi
            git commit -q -m "Update gerakan tanah $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M WIB')"
            git push -q origin HEAD:${{ github.ref_name }} && exit 0
            echo "Push ditolak (ada perubahan baru), mencoba lagi..."; sleep 5
          done
          exit 1
